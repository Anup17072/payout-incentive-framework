<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Incentive Engine</title><meta name="description" content="Admin prototype for field registry and incentive type configuration."><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231a49e5'/%3E%3Cpath d='M8 9h16M8 16h10M8 23h16' stroke='white' stroke-width='3'/%3E%3C/svg%3E"><style>
:root{font-family:Inter,system-ui,-apple-system,sans-serif;color:#182238;background:#f5f7fb;font-size:16px;--blue:#244ee5;--line:#e1e6ef;--muted:#69758a}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button,a,input,select,textarea{outline-offset:4px}button{cursor:pointer}button:disabled{cursor:not-allowed;opacity:.45}aside{position:fixed;inset:0 auto 0 0;width:220px;background:#101d36;color:#fff;padding:30px 18px;display:flex;flex-direction:column}.brand{font-size:19px;font-weight:700;letter-spacing:-.5px;padding:0 12px 44px;display:flex;align-items:center;gap:10px}.mark{display:grid;place-items:center;background:#4165ff;width:30px;height:30px;border-radius:8px;font-size:19px}.nav{background:transparent;border:0;color:#b7c4dc;text-align:left;padding:14px;border-radius:7px;font-size:14px;margin-bottom:5px}.nav.active{color:white;background:#293958}.admin{margin-top:auto;border-top:1px solid #34425a;padding:22px 12px 0;font-size:14px}.admin small{display:block;color:#a4b4cd;margin-top:5px}main{margin-left:220px}header{height:76px;padding:0 40px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);background:#fff}.crumb{font-size:14px;color:var(--muted)}.badge{border:1px solid var(--line);border-radius:20px;padding:5px 10px;font-size:12px;background:#fff;color:#526078}.workspace{max-width:1250px;padding:34px 40px;margin:auto}.titlebar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:24px}h1{font-size:28px;letter-spacing:-.8px;margin:0}h2{font-size:18px;letter-spacing:-.3px;margin:0}h3{font-size:15px;margin:0}.button{border:1px solid #ccd5e3;border-radius:6px;background:white;padding:10px 16px;font-size:14px;font-weight:600;color:#27344a}.button.primary{background:var(--blue);border-color:var(--blue);color:white}.context{display:flex;gap:28px;background:#fff;border:1px solid var(--line);border-radius:9px;padding:18px 22px;margin-bottom:26px;align-items:center}.eyebrow{display:block;color:var(--muted);font-size:12px;margin-bottom:5px;font-weight:600;letter-spacing:.35px}.context strong{font-size:14px}.context .right{margin-left:auto}.info{display:inline-grid;place-items:center;font:600 11px Georgia;border:1px solid #9aa7bc;color:#758198;border-radius:50%;width:15px;height:15px;padding:0;background:transparent;margin-left:6px;vertical-align:middle;cursor:help}.tooltip{position:fixed;z-index:100;background:#13213a;color:#fff;font-size:13px;line-height:1.5;padding:11px 14px;border-radius:6px;max-width:290px;box-shadow:0 6px 18px #0002;pointer-events:none}.panel{background:#fff;border:1px solid var(--line);border-radius:9px;margin-bottom:20px}.panel-head{padding:20px 23px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.panel-body{padding:23px}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;text-align:left}th{font-size:12px;color:var(--muted);font-weight:600;background:#fafbfe;padding:13px 22px}td{padding:18px 22px;border-top:1px solid #edf0f5;font-size:14px}td small{display:block;color:var(--muted);margin-top:5px;font-size:12px}code{font-size:12px;color:#536380}.link{border:0;background:transparent;color:var(--blue);font-weight:600;font-size:14px}.tag{font-size:12px;display:inline-block;padding:5px 9px;border-radius:4px;background:#f0f3f9;color:#526078;margin:3px 3px 3px 0}.quiet{color:var(--muted);font-size:13px;line-height:1.6}.grid{display:grid;grid-template-columns:1fr 1fr;gap:22px}.split{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:22px;align-items:start}.group{margin-bottom:24px}.group:last-child{margin-bottom:0}.label{font-weight:600;font-size:14px;display:block;margin-bottom:10px}select,input[type=text]{width:100%;padding:11px 12px;border:1px solid #cdd5e2;border-radius:6px;background:#fff;color:#182238}textarea{width:100%;padding:16px;border:1px solid #cdd5e2;border-radius:6px;background:#f8faff;font:13px/1.7 ui-monospace,SFMono-Regular,monospace;color:#233e6b;resize:vertical;min-height:250px}.choices{display:flex;flex-wrap:wrap;gap:9px}.choice{display:flex;align-items:center;gap:8px;border:1px solid var(--line);padding:10px 12px;border-radius:6px;font-size:14px;cursor:pointer}.choice:has(input:checked){background:#f0f4ff;border-color:#acbffc;color:#204ac5}.choice:has(input:disabled){opacity:.5;cursor:not-allowed}input[type=checkbox]{accent-color:var(--blue);width:16px;height:16px;margin:0}.type-tabs{display:flex;gap:8px;margin-bottom:22px;flex-wrap:wrap}.type-tab{background:#fff;border:1px solid var(--line);padding:12px 18px;border-radius:6px;font-size:14px}.type-tab.active{border-color:var(--blue);color:var(--blue);box-shadow:inset 0 -2px var(--blue)}.section-number{font-size:12px;font-weight:600;color:#8796b1;margin-right:10px}.summary{border-top:3px solid var(--blue)}.summary dl{margin:0}.summary dt{color:var(--muted);font-size:12px;margin:20px 0 6px}.summary dd{margin:0;font-size:14px;line-height:1.6}.summary dt:first-child{margin-top:0}.savebar{display:flex;justify-content:flex-end;gap:12px;align-items:center;margin-top:20px}.notice{padding:12px 14px;border-radius:6px;font-size:13px;background:#f0f4ff;color:#37508c;margin-top:12px;line-height:1.5}.error{color:#9b293b;background:#fff0f1}.success{color:#236047;background:#edf8f2}.empty{padding:35px;color:var(--muted)}dialog{padding:0;border:1px solid var(--line);border-radius:12px;width:min(800px,95vw);max-height:90vh;box-shadow:0 30px 90px #101d3633}dialog::backdrop{background:#101d3655}dialog .panel-head{position:sticky;top:0;background:white;z-index:2}.dialogbody{padding:24px}.close{border:0;background:#f1f4f8;width:32px;height:32px;border-radius:50%;font-size:21px;color:#63708a}.footer{font-size:12px;color:#7b879b;padding-top:10px}.toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);background:#172b48;color:white;padding:13px 22px;border-radius:8px;box-shadow:0 6px 20px #0002;z-index:110;font-size:14px}.source{margin-top:7px}.source code{font-size:12px}.registry-meta{padding:16px 22px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}@media(max-width:1000px){aside{width:185px}.brand{padding-left:0}main{margin-left:185px}.workspace{padding:28px 24px}.split{grid-template-columns:1fr}.summary{display:none}header{padding:0 24px}.context{gap:18px;flex-wrap:wrap}.context .right{margin-left:0}}@media(max-width:680px){aside{position:static;width:100%;padding:12px;display:flex;flex-direction:row;align-items:center;gap:5px}.brand{padding:0;margin-right:auto;font-size:0}.brand .mark{font-size:18px}.nav{margin:0;padding:10px;font-size:12px}.admin{display:none}main{margin:0}header{height:56px;padding:0 18px}.workspace{padding:24px 16px}h1{font-size:23px}.grid{grid-template-columns:1fr}.context{padding:16px;gap:16px}.context .right{width:100%}.panel-body,.dialogbody{padding:18px}.panel-head{padding:18px}.titlebar{flex-wrap:wrap}.button{padding:10px 12px}.choice{font-size:13px}td,th{padding:14px} }
</style><link rel="stylesheet" href="flows.css"><link rel="stylesheet" href="navigation.css"><link rel="stylesheet" href="incentive-milestones.css"></head><body><aside><div class="brand"><span class="mark">≡</span> Incentive Engine</div><button class="nav active" data-nav="registry">Field registry</button><button class="nav" data-nav="config">Incentive configuration</button><div class="admin">Admin workspace<small>Delivery · Rider</small></div></aside><main><header><span class="crumb">Configuration / <span id="breadcrumb">Field registry</span></span><span class="badge">Sample prototype</span></header><div class="workspace" id="app"></div></main><dialog id="fieldDialog" aria-labelledby="dialogTitle"></dialog><div id="tip" class="tooltip" role="tooltip" hidden></div><div id="toast" class="toast" role="status" hidden></div>
<script>
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const info=(s)=>`<button type="button" class="info" aria-label="${esc(s)}" data-tip="${esc(s)}">i</button>`;
const keys={shipment_type:['COD','Prepaid'],delivery_service:['SDD','NDD'],pdd_status:['Same day','Breached','Not due'],client:['Client A','Client B']};
const keyNames={shipment_type:'Shipment Type',delivery_service:'Delivery Service',pdd_status:'PDD Status',client:'Client'};
const keyHelp={shipment_type:'COD means Cash on Delivery. Prepaid shipments are paid before delivery.',delivery_service:'SDD means Same-Day Delivery. NDD means Next-Day Delivery.',pdd_status:'PDD means Promised Delivery Date. Status is measured on the activity date.',client:'The client associated with a shipment.'};
const entityKeys=['User Type','Center','City','Entity ID'];
const shipmentSql=`SELECT\n  DATE(closed_at) AS date,\n  rider_id AS entity_id,\n  shipment_type, delivery_service, pdd_status, client,\n  COUNT(DISTINCT shipment_id) AS field_value\nFROM shipment_activity\nWHERE status = 'Closed'\nGROUP BY 1, 2, 3, 4, 5, 6`;
const attendanceSql=`SELECT\n  attendance_date AS date,\n  rider_id AS entity_id,\n  COUNT(DISTINCT CASE WHEN present = TRUE\n    THEN attendance_date END) AS field_value\nFROM rider_attendance\nGROUP BY 1, 2`;
let fields=[{id:'shipments',name:'Closed Shipments',kind:'Number',unit:'Shipments',keys:Object.keys(keys),sql:shipmentSql,formula:'count(shipment)',sample:[42,58,36]}, {id:'attendance',name:'Attendance Days',kind:'Number',unit:'Days',keys:[],sql:attendanceSql,formula:'count(distinct present date)',sample:[1,1,0]}, {id:'hours',name:'Login Hours',kind:'Number',unit:'Hours',keys:[],sql:`SELECT\n  DATE(login_at) AS date,\n  rider_id AS entity_id,\n  SUM(login_minutes) / 60.0 AS field_value\nFROM rider_login\nGROUP BY 1, 2`,formula:'sum(login_hours)',sample:[8.5,9,6]}];
let configs=[{name:'Shipment Incentive',primary:'shipments',others:['hours'],eligibility:['hours'],entities:[...entityKeys],keyFilters:Object.keys(keys),payouts:['Lump Sum','Variable'],payout:'shipments',matrix:['all','only','tiered']},{name:'Attendance Incentive',primary:'attendance',others:['shipments'],eligibility:[],entities:[...entityKeys],keyFilters:Object.keys(keys),payouts:['Lump Sum','Variable'],payout:'shipments',matrix:['all']}];
configs.forEach(c=>{c.variableMatrix=[...c.matrix];c.lumpMatrix=['highest','tiered'];delete c.matrix});
let currentView='registry',selected=0,draft=structuredClone(configs[0]),editing=-1,checkedSql=false;
const fby=id=>fields.find(f=>f.id===id);const fname=id=>fby(id)?.name||'—';
const names={all:'Highest Slab — Pay for All',only:'Highest Slab — Slab Units Only',tiered:'Tiered'};
const help={all:'Use the highest achieved slab. For Variable, apply its rate to the full qualifying payout quantity. For Lump Sum, pay its amount once.',only:'Use the highest achieved slab’s rate only for the quantity within that slab. Applies to Variable payouts.',tiered:'For Variable, add each slab’s rate × quantity in that slab. For Lump Sum, add the amounts for each achieved slab.'};
function context(){return `<div class="context"><div><span class="eyebrow">BUSINESS LINE ${info('LOB means Line of Business. This mapping is whitelisted by Tech/Product.')}</span><strong>Delivery</strong></div><div><span class="eyebrow">ENTITY ${info('The type of participant who can earn an incentive in this business line.')}</span><strong>Rider</strong></div><div><span class="eyebrow">ENTITY DATA ${info('The approved source of Rider IDs and their attributes.')}</span><strong>rider_master</strong></div><div class="right"><span class="eyebrow">AVAILABLE ENTITY FILTERS ${info('Whitelisted by Tech/Product. The Admin chooses which are available for each incentive type.')}</span><strong>User Type · Center · City · Entity ID · Zone · Status</strong></div></div>`}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.hidden=false;clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>t.hidden=true,3500)}
function render(){document.querySelectorAll('[data-nav]').forEach(b=>b.classList.toggle('active',b.dataset.nav===currentView));document.getElementById('breadcrumb').textContent=currentView==='registry'?'Field registry':'Incentive configuration';document.getElementById('app').innerHTML=currentView==='registry'?registry():configView();bind()}
function registry(){return `<div class="titlebar"><h1>Field registry ${info('Create SQL-based fields that Admins can make available in incentive types.')}</h1><button class="button primary" id="addField">+ Create field</button></div>${context()}<section class="panel"><div class="panel-head"><h2>Available fields <span class="badge">${fields.length}</span></h2><span class="quiet">Delivery / Rider</span></div><div class="tablewrap"><table><thead><tr><th>FIELD</th><th>VALUE TYPE</th><th>FIELD KEY FILTERS ${info('Attributes that let managers select the activity included in a field.')}</th><th></th></tr></thead><tbody>${fields.map((f,i)=>`<tr><td><strong>${esc(f.name)}</strong><small>${esc(f.formula)}</small></td><td>${esc(f.kind)}<small>${esc(f.unit)}</small></td><td>${f.keys.length?f.keys.map(k=>`<span class="tag">${esc(keyNames[k])}</span>`).join(''):'<span class="quiet">None</span>'}</td><td><button class="link editField" data-index="${i}">Open</button></td></tr>`).join('')}</tbody></table></div><div class="registry-meta">Required query output: Date · Entity ID · Value column ${info('Each query returns date, entity_id, a mapped value column such as key_value, and optional filter columns such as field_filter1.')}</div></section><p class="footer">Sample data · Changes last for this page session.</p>`}
function checks(items,chosen,group,labelFn=x=>x,disabledFn=()=>false,tipFn=()=>null){return `<div class="choices">${items.map(x=>`<label class="choice"><input type="checkbox" data-group="${group}" value="${esc(x)}" ${chosen.includes(x)?'checked':''} ${disabledFn(x)?'disabled':''}>${esc(labelFn(x))}${tipFn(x)?info(tipFn(x)):''}</label>`).join('')}</div>`}
function options(value){return fields.map(f=>`<option value="${f.id}" ${f.id===value?'selected':''}>${esc(f.name)}</option>`).join('')}
function eligibleKeys(){return [...new Set([draft.primary,...draft.others,...draft.eligibility,...(draft.payouts.includes('Variable')?[draft.payout]:[])].flatMap(id=>fby(id)?.keys||[]))]}
function selectedFields(){return [draft.primary,...draft.others]}
function variableRestricted(){return fby(draft.payout)?.kind==='Percentage'||draft.primary!==draft.payout}
function clean(){draft.others=draft.others.filter(x=>x!==draft.primary);draft.eligibility=[...selectedFields()];draft.variableMatrix??=['all'];draft.lumpMatrix??=['highest','tiered'];if(variableRestricted())draft.variableMatrix=draft.variableMatrix.filter(x=>x==='all');draft.keyFilters=draft.keyFilters.filter(x=>eligibleKeys().includes(x))}
const lumpNames={highest:'Highest Slab',tiered:'Tiered'};
const lumpHelp={highest:'Pay the amount for the highest achieved slab once.',tiered:'Add the amounts for each achieved slab.'};
function matrixControls(){return `<div class="group"><span class="label">Applicable Matrix ${info('Choose allowed behaviours separately for each payout type. Managers enter the slabs and reward values.')}</span>${draft.payouts.includes('Lump Sum')?`<div class="group"><span class="eyebrow">LUMP SUM</span>${checks(Object.keys(lumpNames),draft.lumpMatrix,'lumpMatrix',x=>lumpNames[x],()=>false,x=>lumpHelp[x])}</div>`:''}${draft.payouts.includes('Variable')?`<div class="group"><span class="eyebrow">VARIABLE</span>${checks(Object.keys(names),draft.variableMatrix,'variableMatrix',x=>names[x],x=>variableRestricted()&&x!=='all',x=>help[x])}${variableRestricted()?`<div class="notice">${fby(draft.payout)?.kind==='Percentage'?'Percentage Payout Field: Variable supports Pay for All only.':'Different Primary and Payout Fields: Variable supports Pay for All only.'}</div>`:''}</div>`:''}</div>`}
function configView(){clean();return `<div class="titlebar"><h1>Incentive configuration ${info('Define the fields and payout options that managers can use for an incentive type.')}</h1><button class="button" id="newType">+ Create type</button></div>${context()}<div class="type-tabs">${configs.map((c,i)=>`<button class="type-tab ${i===selected?'active':''}" data-type="${i}">${esc(c.name)}</button>`).join('')}${selected===-1?'<button class="type-tab active">New incentive type</button>':''}</div><div class="split"><div><section class="panel"><div class="panel-head"><h2><span class="section-number">01</span> Fields</h2></div><div class="panel-body"><div class="group"><label class="label" for="typeName">Incentive Type ${info('A named set of fields, filters and payout options available to managers.')}</label><input id="typeName" type="text" value="${esc(draft.name)}" maxlength="80"></div><div class="grid"><div class="group"><label class="label" for="primary">Primary Field ${info('Drives progress visibility and slab ordering for this incentive type.')}</label><select id="primary">${options(draft.primary)}</select></div><div class="group"><span class="label">Other Fields ${info('Additional numeric fields that managers can include in the target matrix. Up to two, for a three-field matrix.')}</span>${checks(fields.filter(f=>f.id!==draft.primary).map(f=>f.id),draft.others,'others',fname)}</div></div></div></section><section class="panel"><div class="panel-head"><h2><span class="section-number">02</span> Filters</h2></div><div class="panel-body"><div class="group"><span class="label">Entity Filters ${info('Managers use these to select participating riders. Available attributes are whitelisted by Tech/Product.')}</span>${checks(entityKeys,draft.entities,'entities')}</div><div class="group"><span class="label">Field Key Filters ${info('Managers use these to select which activity is counted. A filter only affects fields that expose that key.')}</span>${eligibleKeys().length?checks(eligibleKeys(),draft.keyFilters,'keyFilters',k=>keyNames[k],()=>false,k=>keyHelp[k]):'<span class="quiet">No keys on the selected fields.</span>'}</div></div></section><section class="panel"><div class="panel-head"><h2><span class="section-number">03</span> Payout</h2></div><div class="panel-body"><div class="grid"><div class="group"><span class="label">Payout Types ${info('Lump Sum pays an amount. Variable multiplies a rate by the applicable quantity from the Payout Field.')}</span>${checks(['Lump Sum','Variable'],draft.payouts,'payouts')}</div>${draft.payouts.includes('Variable')?`<div class="group"><label class="label" for="payout">Payout Field ${info('Automatically selected for managers when they choose Variable. It must be numeric.')}</label><select id="payout">${options(draft.payout)}</select></div>`:''}</div>${matrixControls()}</div></section><div class="savebar"><span id="configStatus" class="quiet" role="status"></span><button class="button" id="resetConfig">Reset</button><button class="button primary" id="saveConfig">Save configuration</button></div></div><section class="panel summary"><div class="panel-head"><h2>Manager will see ${info('A summary of the options made available by this configuration.')}</h2></div><div class="panel-body" id="summary">${summary()}</div></section></div><p class="footer">Sample data · Changes last for this page session.</p>`}
function summary(){return `<dl><dt>INCENTIVE TYPE</dt><dd>${esc(draft.name||'New incentive type')}</dd><dt>PRIMARY FIELD</dt><dd>${esc(fname(draft.primary))}</dd><dt>OTHER FIELDS</dt><dd>${draft.others.map(fname).map(esc).join(', ')||'None'}</dd><dt>PAYOUT TYPES</dt><dd>${draft.payouts.join(' · ')||'None selected'}</dd>${draft.payouts.includes('Variable')?`<dt>PAYOUT FIELD</dt><dd>${esc(fname(draft.payout))}</dd>`:''}${draft.payouts.includes('Lump Sum')?`<dt>LUMP SUM MATRIX</dt><dd>${draft.lumpMatrix.map(x=>esc(lumpNames[x])).join('<br>')||'None selected'}</dd>`:''}${draft.payouts.includes('Variable')?`<dt>VARIABLE MATRIX</dt><dd>${draft.variableMatrix.map(x=>esc(names[x])).join('<br>')||'None selected'}</dd>`:''}</dl>`}
function saveConfig(){draft.name=document.getElementById('typeName').value.trim();if(!draft.name||!draft.payouts.length||(draft.payouts.includes('Variable')&&!draft.variableMatrix.length)||(draft.payouts.includes('Lump Sum')&&!draft.lumpMatrix.length)){toast('Enter a name and select a matrix behaviour for each enabled payout type.');return false}if(configs.some((c,i)=>i!==selected&&c.name.toLowerCase()===draft.name.toLowerCase())){toast('An incentive type with this name already exists.');return false}if(selected===-1){configs.push(structuredClone(draft));selected=configs.length-1}else configs[selected]=structuredClone(draft);render();toast('Configuration saved for this session.');return true}
function bind(){document.getElementById('addField')?.addEventListener('click',()=>openField(-1));document.querySelectorAll('.editField').forEach(b=>b.onclick=()=>openField(Number(b.dataset.index)));document.querySelectorAll('[data-type]').forEach(b=>b.onclick=()=>{selected=Number(b.dataset.type);draft=structuredClone(configs[selected]);render()});document.getElementById('newType')?.addEventListener('click',()=>{selected=-1;draft={name:'',primary:'shipments',others:[],eligibility:[],entities:[...entityKeys],keyFilters:Object.keys(keys),payouts:['Lump Sum','Variable'],payout:'shipments',variableMatrix:['all'],lumpMatrix:['highest','tiered']};render()});document.getElementById('typeName')?.addEventListener('input',e=>{draft.name=e.target.value;document.getElementById('summary').innerHTML=summary()});for(const id of ['primary','payout'])document.getElementById(id)?.addEventListener('change',e=>{draft[id]=e.target.value;render()});document.querySelectorAll('[data-group]').forEach(x=>x.addEventListener('change',()=>{const g=x.dataset.group;draft[g]=[...document.querySelectorAll(`[data-group="${g}"]:checked`)].map(c=>c.value);if(g==='others'&&draft.others.length>2){draft.others.pop();toast('Select up to two other fields.')}render()}));document.getElementById('saveConfig')?.addEventListener('click',saveConfig);document.getElementById('resetConfig')?.addEventListener('click',()=>{draft=selected>=0?structuredClone(configs[selected]):{name:'',primary:'shipments',others:[],eligibility:[],entities:[...entityKeys],keyFilters:[],payouts:['Lump Sum'],payout:'shipments',variableMatrix:['all'],lumpMatrix:['highest','tiered']};render()})}
function openField(index){editing=index;checkedSql=false;const f=index>=0?fields[index]:{name:'',kind:'Number',unit:'Shipments',keys:[],sql:'SELECT\n  DATE(closed_at) AS date,\n  rider_id AS entity_id,\n  COUNT(DISTINCT shipment_id) AS field_value\nFROM shipment_activity\nGROUP BY 1, 2'};const d=document.getElementById('fieldDialog');d.innerHTML=`<div class="panel-head"><h2 id="dialogTitle">${index<0?'Create field':esc(f.name)}</h2><button class="close" id="closeDialog" aria-label="Close">×</button></div><div class="dialogbody"><div class="grid"><div class="group"><label class="label" for="fieldName">Field name</label><input type="text" id="fieldName" value="${esc(f.name)}" maxlength="80"></div><div class="group"><label class="label" for="fieldKind">Value type ${info('Fields return numeric values. Percentage represents a ratio displayed as a percent.')}</label><select id="fieldKind"><option ${f.kind==='Number'?'selected':''}>Number</option><option ${f.kind==='Percentage'?'selected':''}>Percentage</option></select></div></div><div class="group"><label class="label" for="sql">SQL query ${info('Return date, entity_id and field_value. Return any grouping keys you want to expose as filters.')}</label><textarea id="sql" spellcheck="false">${esc(f.sql)}</textarea></div><div class="group"><span class="label">Field Keys ${info('Select keys returned by the query. Their grouped categories must not overlap and must cover the relevant records.')}</span>${checks(Object.keys(keys),f.keys,'fieldkeys',k=>keyNames[k],()=>false,k=>keyHelp[k])}</div><button class="button" id="checkQuery">Check required columns</button>${info('Prototype check for output column names only. SQL execution and entity coverage checks are not connected.')}<div id="queryResult" role="status"></div>${index>=0?`<div class="group" style="margin-top:24px"><span class="label">Sample output ${info('Illustrative rows, not live SQL results. Values shown are totals per rider and date.')}</span><div class="tablewrap"><table><thead><tr><th>Date</th><th>Entity ID</th><th>Field Value</th></tr></thead><tbody>${f.sample.map((v,i)=>`<tr><td>2026-10-06</td><td>RDR-${1041+i}</td><td>${v}</td></tr>`).join('')}</tbody></table></div></div>`:''}<div class="savebar"><button class="button" id="cancelField">Cancel</button><button class="button primary" id="saveField">Save field</button></div></div>`;d.showModal();document.getElementById('closeDialog').onclick=()=>d.close();document.getElementById('cancelField').onclick=()=>d.close();document.getElementById('sql').oninput=()=>{checkedSql=false;document.getElementById('queryResult').innerHTML=''};document.querySelectorAll('[data-group=fieldkeys]').forEach(c=>c.onchange=()=>{checkedSql=false;document.getElementById('queryResult').innerHTML=''});document.getElementById('checkQuery').onclick=checkQuery;document.getElementById('saveField').onclick=()=>{const name=document.getElementById('fieldName').value.trim();if(!name){toast('Enter a field name.');return}if(fields.some((f,i)=>i!==editing&&f.name.toLowerCase()===name.toLowerCase())){toast('A field with this name already exists.');return}if(!checkedSql&&!checkQuery())return;const existing=editing>=0?fields[editing]:null;const data={id:existing?.id||'field-'+Date.now(),name,kind:document.getElementById('fieldKind').value,unit:existing?.unit||'Numeric value',keys:[...document.querySelectorAll('[data-group=fieldkeys]:checked')].map(x=>x.value),sql:document.getElementById('sql').value,formula:existing?.formula||'SQL-defined field',sample:existing?.sample||[0,0,0]};if(editing>=0)fields[editing]=data;else fields.push(data);d.close();render();toast('Field saved for this session.')}}
function checkQuery(){const sql=document.getElementById('sql').value.replace(/--[^\n]*/g,'').replace(/\/\*[\s\S]*?\*\//g,'');const projection=(sql.match(/\bselect\b([\s\S]*?)\bfrom\b/i)||[])[1]||'';const required=['date','entity_id','field_value',...[...document.querySelectorAll('[data-group=fieldkeys]:checked')].map(c=>c.value)];const missing=required.filter(k=>!new RegExp('(?:\\bas\\s+'+k+'\\b|(?:^|,)\\s*(?:\\w+\\.)?'+k+'\\s*(?:,|$))','i').test(projection));checkedSql=!missing.length;document.getElementById('queryResult').innerHTML=`<div class="notice ${checkedSql?'success':'error'}">${checkedSql?'Required output column names found. SQL execution and entity coverage are not checked in this prototype.':'Missing output columns: '+esc(missing.join(', '))}</div>`;return checkedSql}
document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>{currentView=b.dataset.nav;render()});
let tipTarget;function showTip(target){if(!target?.dataset.tip)return;tipTarget=target;let tip=document.getElementById('tip');if(!tip){tip=document.createElement('div');tip.id='tip';tip.className='tooltip';tip.setAttribute('role','tooltip');document.body.append(tip)}const dlg=document.getElementById('fieldDialog');(dlg.open?dlg:document.body).append(tip);tip.textContent=target.dataset.tip;tip.hidden=false;const r=target.getBoundingClientRect();tip.style.left=Math.max(8,Math.min(r.left,window.innerWidth-300))+'px';tip.style.top=Math.max(8,Math.min(r.bottom+8,window.innerHeight-tip.offsetHeight-8))+'px'}function hideTip(){const tip=document.getElementById('tip');if(tip)tip.hidden=true;tipTarget=null}document.addEventListener('mouseover',e=>{const t=e.target.closest('[data-tip]');if(t)showTip(t)});document.addEventListener('mouseout',e=>{if(e.target.closest('[data-tip]'))hideTip()});document.addEventListener('focusin',e=>showTip(e.target.closest('[data-tip]')));document.addEventListener('focusout',hideTip);document.addEventListener('click',e=>{const t=e.target.closest('[data-tip]');if(t){e.preventDefault();e.stopPropagation();showTip(t)}});document.addEventListener('keydown',e=>{if(e.key==='Escape')hideTip()});window.addEventListener('scroll',hideTip,true);
render();
if(document.modelContext?.registerTool){const lifecycle=new AbortController();const register=t=>{try{Promise.resolve(document.modelContext.registerTool(t,{signal:lifecycle.signal})).catch(()=>{})}catch{}};register({name:'read_admin_configuration',description:'Read sample fields and saved incentive type configurations for this page session.',inputSchema:{type:'object',properties:{},additionalProperties:false},annotations:{readOnlyHint:true},execute:()=>({fields,configs})});register({name:'open_incentive_configuration',description:'Open an existing incentive type for editing; does not save changes.',inputSchema:{type:'object',properties:{name:{type:'string'}},required:['name'],additionalProperties:false},annotations:{readOnlyHint:false},execute:input=>{if(!input||typeof input.name!=='string')throw Error('name is required');const index=configs.findIndex(c=>c.name===input.name);if(index<0)throw Error('Unknown incentive type');selected=index;draft=structuredClone(configs[index]);currentView='config';render();return {opened:draft.name}}});window.addEventListener('pagehide',()=>lifecycle.abort(),{once:true})}
</script><script src="flows.js"></script><script src="filters.js"></script><script src="whitelist.js"></script><script src="entity-query.js"></script><script src="detect-fields.js"></script><script src="column-mappings.js"></script><script src="unified-filters.js"></script><script src="manager-context.js"></script><script src="admin-context.js"></script><script src="coverage.js"></script><script src="navigation-index.js"></script><script src="incentive-milestone-engine.js"></script><script src="incentive-milestones.js"></script><script src="incentive-coverage-preview.js"></script></body></html>
